<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Plant Glucose Simulation</title>
    <style>
      body {
        margin: 0px;
        padding: 0px;
        font-family: Roboto, Helvetica-Nueue, Arial, sans-serif;
      }
      label {
        font-weight: bold;
      }
      .switchInput:hover,
      #controls:hover {
        cursor: pointer;
      }
      .switchInput {
        width: 48px;
        margin-top: 20px;
        margin-right: -8px;
        margin-left: -8px;
        transform: rotate(270deg);
        -moz-transform: rotate(
          270deg
        ); /*do same for other browsers if required*/
      }
      .switchInput5 {
        width: 88px;
        margin-left: -32px;
        margin-top: 42px;
        margin-right: -24px;
      }
      #powerSwitch {
        position: relative;
      }
      #model {
        border: 1px solid;
        border-right: none;
        background-color: #deebf7;
      }
      #highchartsDiv {
        border: 1px solid;
      }
      #waitImage {
        display: none;
        position: absolute;
        top: 44px;
        right: -12px;
        opacity: 0.7;
      }
      .controls {
        display: flex;
      }
      .controls > * {
        padding: 8px;
        padding-right: 16px;
      }
      .lightSwitch,
      #waterSwitch {
        display: none;
      }
      .switch > * {
        display: inline-block;
        vertical-align: top;
      }
      .switch > label {
        display: block;
      }
      .content {
        display: flex;
        margin-top: 4px;
      }
      .model {
        display: flex;
      }
      .key {
        padding: 8px;
        border: 1px solid;
        max-width: 50%;
        margin: 0 8px;
        width: 180px;
      }
      .key h2 {
        font-size: 1.2rem;
        margin: 0 auto 0.5em;
        text-align: center;
      }
      @media (max-width: 940px) {
        .content {
          flex-direction: column;
        }
        .key {
          margin: -1px 0 8px 0;
          width: 685px;
          max-width: 100%;
        }

        .key h2 {
          text-align: start;
        }
      }
      .keyItems {
        display: flex;
        flex-wrap: wrap;
      }
      .keyItem {
        display: flex;
        align-items: center;
        margin: 4px;
        font-size: 0.85rem;
      }
      .keyImg {
        width: auto;
        height: 26px;
        margin: 0 8px;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <div id="powerSwitch">
        <div id="lightSwitch" class="switch lightSwitch">
          <label for="lightSwitchInput">Light</label>
          <input
            type="range"
            max="1"
            step="1"
            value="1"
            id="lightSwitchInput"
            name="lightSwitchInput"
            class="switchInput"
            title="Turn light ON/OFF"
            aria-label="Turn light ON/OFF"
          />
          <div>
            <div style="margin-top: 5px" class="lightLevelLabel1">ON</div>
            <div style="margin-top: 12px" class="lightLevelLabel0">OFF</div>
          </div>
        </div>
        <div id="lightSwitch3" class="switch lightSwitch">
          <label for="lightSwitchInput3">Light</label>
          <input
            type="range"
            max="2"
            step="1"
            value="2"
            id="lightSwitchInput3"
            name="lightSwitchInput3"
            class="switchInput"
            title="Change light intensity"
            aria-label="Change light intensity"
          />
          <div>
            <div class="lightLevelLabel2">Full</div>
            <div class="lightLevelLabel1">Half</div>
            <div class="lightLevelLabel0">Off</div>
          </div>
        </div>
        <div id="lightSwitch5" class="switch lightSwitch">
          <label for="lightSwitchInput5">Light</label>
          <input
            type="range"
            max="4"
            step="1"
            value="4"
            id="lightSwitchInput5"
            name="lightSwitchInput5"
            class="switchInput switchInput5"
            title="Change light intensity"
            aria-label="Change light intensity"
          />
          <div>
            <div class="lightLevelLabel4">100%</div>
            <div class="lightLevelLabel3">75%</div>
            <div class="lightLevelLabel2">50%</div>
            <div class="lightLevelLabel1">25%</div>
            <div class="lightLevelLabel0">Off</div>
          </div>
        </div>
        <img id="waitImage" src="images/wait.png" alt="wait" />
      </div>
      <div id="waterSwitch">
        <label for="waterSwitchInput">Water</label>
        <div class="switch">
          <div>
            <input
              type="range"
              max="1"
              step="1"
              value="1"
              id="waterSwitchInput"
              name="waterSwitchInput"
              class="switchInput"
              title="Turn water ON/OFF"
            />
          </div>
          <div>
            <div style="margin-top: 5px" class="waterLevelLabel1">YES</div>
            <div style="margin-top: 12px" class="waterLevelLabel0">NO</div>
          </div>
        </div>
      </div>
      <div id="animationSpeedSwitch">
        <label for="animationSpeedSwitchInput">Animation Speed</label>
        <div class="switch">
          <input
            type="range"
            max="3"
            min="1"
            step="1"
            value="1"
            name="animationSpeedSwitchInput"
            id="animationSpeedSwitchInput"
            title="Change animation speed"
            class="switchInput"
          />
          <div style="text-align: left">
            <div>4x</div>
            <div>2x</div>
            <div>Normal</div>
          </div>
        </div>
      </div>
      <div id="controls">
        <label>Controls</label>
        <div class="switch">
          <img
            id="playPauseButton"
            src="images/playCircle.png"
            alt="Play"
            title="Play simulation"
            role="button"
            tabindex="0"
          />
          <img
            id="resetButton"
            src="images/replay.png"
            title="Reset simulation"
            alt="Reset"
            role="button"
            tabindex="0"
          />
        </div>
      </div>
    </div>
    <div class="content">
      <div class="model">
        <svg
          id="model"
          width="400"
          height="320"
          viewBox="0 0 1000 1000"
          version="1.1"
          xmlns="http://www.w3.org/2000/svg"
        >
          <rect x="0" y="0" width="1000" height="1000" fill="#DEEBF7" />
        </svg>
        <div id="highchartsDiv" style="width: 300px; max-width: 50%"></div>
      </div>
      <div class="key">
        <h2>Key</h2>
        <div class="keyItems">
          <div class="keyItem">
            <span class="keyText">Photon</span>
            <img class="keyImg" src="images/photon.png" alt="Photon" />
          </div>
          <div class="keyItem">
            <span class="keyText">Water</span>
            <img class="keyImg" src="images/water.png" alt="Water" />
          </div>
          <div class="keyItem">
            <span class="keyText">Glucose</span>
            <img class="keyImg" src="images/glucose.png" alt="Glucose" />
          </div>
          <div class="keyItem">
            <span class="keyText">Chloroplast</span>
            <img
              class="keyImg"
              src="images/chloroplast.png"
              alt="Chloroplast"
            />
          </div>
          <div class="keyItem">
            <span class="keyText">Mitochondrion</span>
            <img
              class="keyImg"
              src="images/mitochondrion.png"
              alt="Mitochondrion"
            />
          </div>
          <div class="keyItem">
            <span class="keyText">Vacuole</span>
            <img class="keyImg" src="images/storage.png" alt="Vacuole" />
          </div>
        </div>
      </div>
    </div>
    <script src="bundle.js"></script>
  </body>
</html>
